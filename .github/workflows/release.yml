name: release

on:
  push:
    tags:
      - "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Test
        run: go test ./...
      - name: Build release archives
        run: make package-release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ssh-tun_1.0.0_linux_amd64.tar.gz
            build/ssh-tun_1.0.0_linux_arm64.tar.gz
            build/SHA256SUMS
