name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Verify Windows cross-build
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/ssh-tun.exe ./cmd/ssh-tun
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -o /tmp/ssh-tun-arm64.exe ./cmd/ssh-tun
      - name: Verify tag and source version
        shell: bash
        run: |
          source_version=$(awk '/^VERSION := / { print $3 }' Makefile)
          test "${GITHUB_REF_NAME}" = "v${source_version}"
      - name: Build release archives
        run: make package-release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## ssh-tun 1.0.3

            - Added OS-aware configuration templates and native systemd, OpenRC, and Windows service management.
            - Added monitored SSH keepalives and automatic reconnection without restarting local proxy listeners.
            - Fixed Windows elevation handling so Windows never attempts to invoke sudo.
            - Tightened configuration, routing, startup, and service validation.
            - Added Linux and Windows amd64/arm64 release binaries and regression tests.
          files: |
            build/ssh-tun_*_linux_amd64.tar.gz
            build/ssh-tun_*_linux_arm64.tar.gz
            build/ssh-tun_*_windows_amd64.exe.tar.gz
            build/ssh-tun_*_windows_arm64.exe.tar.gz
            build/SHA256SUMS
