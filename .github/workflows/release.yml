name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Verify Windows cross-build
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/ssh-tun.exe ./cmd/ssh-tun
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -o /tmp/ssh-tun-arm64.exe ./cmd/ssh-tun
      - name: Verify tag and source version
        shell: bash
        run: |
          source_version=$(awk '/^VERSION := / { print $3 }' Makefile)
          test "${GITHUB_REF_NAME}" = "v${source_version}"
      - name: Install UPX
        shell: bash
        run: |
          upx_version=5.2.1
          archive="upx-${upx_version}-amd64_linux.tar.xz"
          curl -fsSLO "https://github.com/upx/upx/releases/download/v${upx_version}/${archive}"
          echo "402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657  ${archive}" | sha256sum -c -
          tar -xJf "${archive}"
          sudo install -m 0755 "upx-${upx_version}-amd64_linux/upx" /usr/local/bin/upx
          upx --version
      - name: Build release archives
        run: make package-release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/ssh-tun_*_linux_amd64.tar.gz
            build/ssh-tun_*_linux_arm64.tar.gz
            build/ssh-tun_*_windows_amd64.exe.tar.gz
            build/ssh-tun_*_windows_arm64.exe.tar.gz
            build/SHA256SUMS
