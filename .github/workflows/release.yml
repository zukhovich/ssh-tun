name: release

on:
  push:
    tags:
      - "v1.0.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Test
        run: go test ./...
      - name: Build release archives
        run: make package-release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            - Fixed SSH public-key authentication with explicitly selected identity files.
            - Added support for SSH agent keys and interactive unlocking of passphrase-protected identity files.
            - Added the conventional `--identity-file` option while preserving `--identity_file` compatibility.
            - Defaulted no-configuration startup and logs to English regardless of the system locale.
            - Added end-to-end SSH key authentication coverage and revalidated the existing test suite.
          files: |
            build/ssh-tun_1.0.1_linux_amd64.tar.gz
            build/ssh-tun_1.0.1_linux_arm64.tar.gz
            build/SHA256SUMS
